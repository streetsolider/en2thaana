<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>en2thaana: speak English in a British accent</title>
<meta name="description" content="Speak English in a British accent. Type English, read it back in Thaana, said the way they say it on the BBC.">
<style>
@font-face {
  font-family: Faruma;
  src: url("Faruma.woff2") format("woff2");
  font-display: swap;
}
:root {
  --bg:#f7f7f8; --panel:#fff; --ink:#16181d; --muted:#6b7280; --line:#e3e5e9;
  --accent:#2563eb; --warn:#b45309; --warnbg:#fdf2d7; --ok:#059669;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0f1115; --panel:#171a21; --ink:#e8eaed; --muted:#9aa1ad; --line:#262b34;
    --accent:#60a5fa; --warn:#fbbf24; --warnbg:#3a2f12; --ok:#34d399;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:740px;margin:0 auto;padding:20px 16px 56px}
header{margin-bottom:18px}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:14px}
textarea{
  width:100%;min-height:118px;padding:14px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font:inherit;resize:vertical
}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.bar{display:flex;gap:8px;align-items:center;margin:10px 0 16px;flex-wrap:wrap}
button{
  font:600 15px/1 inherit;padding:11px 16px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  cursor:pointer;min-height:44px
}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:default}
.spacer{flex:1}
label.toggle{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px}
.out{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:18px 16px;min-height:92px;margin-bottom:12px
}
.thaana{
  font-family:Faruma,sans-serif;font-size:27px;line-height:2.1;
  direction:rtl;text-align:right;unicode-bidi:isolate;word-wrap:break-word
}
.thaana .unk{
  direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:inherit;
  font-size:17px;background:var(--warnbg);color:var(--warn);
  border-radius:5px;padding:0 5px
}
.stats{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:18px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;
   text-transform:uppercase;letter-spacing:.05em;padding:6px 8px}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
td.th{font-family:Faruma,sans-serif;font-size:20px;direction:rtl;text-align:right}
.tag{font-size:11px;padding:2px 6px;border-radius:5px;background:var(--bg);
     border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.registry{color:var(--ok);border-color:var(--ok)}
.tag.none{color:var(--warn);border-color:var(--warn)}
tr.miss td{background:var(--warnbg)}
.hidden{display:none}
.loading{color:var(--muted);font-size:14px}
.bar-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.bar-fill{height:100%;width:0;background:var(--accent);transition:width .15s}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
       color:var(--muted);font-size:13px;line-height:1.7}
footer b{color:var(--ink)}
footer code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.ex button{font-size:13px;padding:7px 11px;min-height:0;font-weight:500;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>en2thaana</h1>
    <p>Speak English in a British accent. Type it here and read it back in
       Thaana, said the way they say it on the BBC.</p>
  </header>

  <textarea id="in" autocapitalize="off" autocorrect="off" spellcheck="false"
    placeholder="Type or paste English here…"></textarea>

  <div class="ex">
    <button data-ex="clerk derby schedule been again vase leisure">tricky words</button>
    <button data-ex="What do you want to watch?">a question</button>
    <button data-ex="Dr. Hassan sent a PDF about 120,000 entries in 2019.">titles and numbers</button>
    <button data-ex="The ferry to Hithadhoo leaves at four.">a place name</button>
  </div>

  <div class="bar">
    <button class="primary" id="go" disabled>Transcribe</button>
    <button id="copy" disabled>Copy</button>
    <div class="spacer"></div>
    <label class="toggle"><input type="checkbox" id="detail"> Detail</label>
  </div>

  <div class="out">
    <div id="loading" class="loading">
      Loading dictionary…
      <div class="bar-track"><div class="bar-fill" id="fill"></div></div>
    </div>
    <div class="thaana" id="out"></div>
  </div>
  <div class="stats" id="stats"></div>

  <div id="tablewrap" class="hidden">
    <table>
      <thead><tr><th>word</th><th>thaana</th><th>from</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <footer id="foot"></footer>
</div>

<script type="module">
import { load, transcribe } from "./app.js";
import { DATA } from "./data.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let timer = null;

function run() {
  const text = $("#in").value;
  if (!text.trim()) { $("#out").innerHTML = ""; $("#stats").innerHTML = ""; return; }
  const toks = transcribe(text);

  $("#out").innerHTML = toks.map((t) =>
    t.thaana === null ? '<span class="unk">' + esc(t.text) + "</span>" : esc(t.thaana)
  ).join("");

  const words = toks.filter((t) => t.kind === "word" || t.kind === "placename");
  const miss = words.filter((t) => t.thaana === null);
  const gaz = words.filter((t) => t.source === "registry");
  $("#stats").innerHTML =
    "<span><b>" + words.length + "</b> words</span>" +
    "<span><b>" + (words.length - miss.length) + "</b> transcribed</span>" +
    (gaz.length ? '<span style="color:var(--ok)"><b>' + gaz.length + "</b> from registry</span>" : "") +
    (miss.length ? '<span style="color:var(--warn)"><b>' + miss.length + "</b> not known</span>" : "");

  $("#tbody").innerHTML = toks
    .filter((t) => t.kind !== "other" && t.kind !== "number")
    .map((t) =>
      '<tr class="' + (t.thaana === null ? "miss" : "") + '">' +
      "<td>" + esc(t.text) + "</td>" +
      '<td class="th">' + (t.thaana ? esc(t.thaana) : "—") + "</td>" +
      '<td><span class="tag ' + (t.source === "registry" ? "registry" : t.source ? "" : "none") +
        '">' + esc(t.source || "not known") + "</span></td></tr>").join("");
}

$("#go").onclick = run;
$("#in").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 250); });
$("#detail").onchange = (e) => $("#tablewrap").classList.toggle("hidden", !e.target.checked);
document.querySelectorAll("[data-ex]").forEach((b) =>
  b.onclick = () => { $("#in").value = b.dataset.ex; run(); });
$("#copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText($("#out").innerText);
    $("#copy").textContent = "Copied";
    setTimeout(() => ($("#copy").textContent = "Copy"), 1200);
  } catch (e) { /* clipboard needs https on some browsers */ }
};

load((p) => ($("#fill").style.width = (p * 100).toFixed(0) + "%")).then((n) => {
  $("#loading").remove();
  $("#go").disabled = $("#copy").disabled = false;
  $("#foot").innerHTML =
    "English spelling lies. <i>Clerk</i> is said \"clark\", <i>been</i> rhymes with " +
    "<i>bin</i>, and <i>schedule</i> starts with a sh. Thaana writes every vowel down, " +
    "so it can show you what the word actually sounds like.<br><br>" +
    "<b>This is not translation.</b> ދަ ކޮމްޕިޔުޓަރ is the English word <code>computer</code> " +
    "written so you can say it. Read it out loud and an English speaker understands you.<br><br>" +
    "<b>" + n.toLocaleString() + "</b> words, plus <b>" + DATA.counts.gazetteer +
    "</b> Maldivian place names. Highlighted words are ones the dictionary does not have. " +
    "The accent is Received Pronunciation, so <i>car</i> is ކާ and not ކާރ. " +
    "Everything runs in this page and nothing is sent anywhere.";
  run();
}).catch((e) => {
  $("#loading").textContent = "Could not load the dictionary. " + e;
});
</script>
</body>
</html>
